<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>경기신학교 | Gyeonggi Seminary</title>
    <script>
      // SPA redirect: GitHub Pages에서 직접 URL 접근 시 index.html로 리다이렉트
      var path = window.location.pathname.replace('/Gyeonggi-Seminary', '');
      if (path === '/' || path === '') {
        path = '';
      }
      window.location.replace('/Gyeonggi-Seminary/' + (path ? '#' + path : ''));
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/Gyeonggi-Seminary/">경기신학교 홈페이지</a>...</p>
  </body>
</html>
